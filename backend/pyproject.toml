[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "audio-separator[cpu]>=0.44.2",
    "bcrypt>=5.0.0",
    "fastapi>=0.136.3",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "instructor>=1.14.0",
    "librosa>=0.11.0",
    "matplotlib>=3.10.9",
    "moviepy>=2.2.1",
    "openai>=2.38.0",
    "opencv-python>=4.13.0.92",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.30",
    "scenedetect>=0.7",
    "sqlmodel>=0.0.38",
    "tenacity>=9.1.4",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "transformers>=5.9.0",
    "uvicorn>=0.48.0",
    "aubio>=0.4.9",
    "headroom-ai[all]>=0.23.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
select = ["I", "UP", "E", "F", "W", "C90"]

[tool.pytest.ini_options]
testpaths = ["tests"]
